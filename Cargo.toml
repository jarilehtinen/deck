[package]
name = "deck"
version = "0.1.0"
edition = "2024"
description = "A minimal Spotify player for the terminal, built around your own album shelf and a weekly AI-curated album list"
license = "MIT"
repository = "https://github.com/jarilehtinen/deck"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
env_logger = "0.11.11"
jiff = "0.2.37"
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-oauth = "0.8"
librespot-playback = "0.8"
log = "0.4.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

# macOS Now Playing and media keys (`now_playing`).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString", "NSURL", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
